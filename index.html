
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPOS Pro - Luxury Obsidian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f1f5f9;
            letter-spacing: -0.01em;
            overflow: hidden;
        }

        /* Dark Mode Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        .obsidian-card {
            background: #0f172a; /* Slate 900 */
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .obsidian-card:hover {
            transform: translateY(-4px);
            border-color: rgba(249, 115, 22, 0.3); /* Orange accent */
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .shadow-glow-orange { box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.4); }
        .shadow-glow-green { box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.4); }

        .gradient-dark-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
        .gradient-dark-green { background: linear-gradient(135deg, #10b981, #059669); }

        .glass-dark {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Utility for hiding scrollbar but allowing scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media print {
            @page {
                margin: 0;
                size: auto;
            }
            .no-print { display: none !important; }
            .print-only { 
                display: block !important; 
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }
            body { 
                background: white !important; 
                color: black !important;
                overflow: visible !important;
            }
        }
        .print-only { display: none; }
    </style>
<script type="importmap">

</html>
